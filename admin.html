<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Astra Active | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --cream: #F3EEE4;
        --paper: #FFFFFF;
        --ink: #221E19;
        --sub: #6E6659;
        --accent: #C1442E;
        --forest: #2F4A3B;
        --line: rgba(34,30,25,0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); font-family: 'Public Sans', sans-serif; color: var(--ink); }

    .topbar { display: flex; align-items: center; justify-content: space-between; max-width: 960px; margin: 0 auto; padding: 22px 24px; }
    .topbar h1 { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; font-size: 1.4rem; margin: 0; letter-spacing: 0.01em; }
    .whoami { font-size: 0.85rem; color: var(--sub); display: flex; align-items: center; gap: 12px; }
    .whoami a { color: var(--accent); text-decoration: none; font-weight: 700; }

    .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px 80px; }

    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 18px; }
    .btn { background: var(--ink); color: #fff; border: none; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .btn:hover { background: var(--accent); }
    .btn-outline { background: none; color: var(--ink); border: 1px solid var(--line); }
    .btn-outline:hover { background: var(--paper); color: var(--accent); border-color: var(--accent); }
    .btn-danger { background: none; color: var(--accent); border: 1px solid var(--accent); }
    .btn-danger:hover { background: var(--accent); color: #fff; }

    .trip-list { display: flex; flex-direction: column; gap: 12px; }
    .trip-row { background: var(--paper); border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 4px 14px rgba(34,30,25,0.05); }
    .trip-row.hidden-trip { opacity: 0.55; }
    .trip-info h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .trip-meta { font-size: 0.82rem; color: var(--sub); }
    .hidden-badge { display: inline-block; background: var(--line); color: var(--sub); border-radius: 999px; padding: 2px 10px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-left: 8px; }
    .trip-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .trip-actions button { padding: 7px 14px; font-size: 0.8rem; border-radius: 999px; }

    .empty-state, .loading-state { text-align: center; color: var(--sub); padding: 60px 0; }

    #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(34,30,25,0.55); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal { background: var(--paper); border-radius: 20px; padding: 32px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; color: var(--forest); margin: 0 0 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 700; font-size: 0.82rem; margin-bottom: 5px; }
    .form-group .hint { font-weight: 500; color: var(--sub); font-size: 0.76rem; margin-top: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
    .checkbox-row input { width: auto; }
    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    #status-message { display: none; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 0.85rem; font-weight: 600; }
    #status-message.error { background: #FBE4DF; color: var(--accent); }
    #status-message.success { background: #E4EBE6; color: var(--forest); }

    @media (max-width: 560px) {
        .form-row { grid-template-columns: 1fr; }
        .trip-row { flex-direction: column; align-items: stretch; }
        .trip-actions { justify-content: flex-end; }
    }
</style>
</head>
<body>

<div class="topbar">
    <h1>Trip Admin</h1>
    <div class="whoami" id="whoami">Loading…</div>
</div>

<div class="wrap">
    <div class="toolbar">
        <button class="btn" onclick="openForm()">+ Add Trip</button>
    </div>
    <div id="tripList" class="loading-state">Loading trips…</div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h2 id="formTitle">Add Trip</h2>
        <div id="status-message"></div>
        <input type="hidden" id="tripId">

        <div class="form-row">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="title" placeholder="Historic Jamestown">
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="location" placeholder="Jamestown, Virginia">
            </div>
        </div>

        <div class="form-group">
            <label>Date</label>
            <input type="date" id="date">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="description" placeholder="Shown on the trip card and homepage banner."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Banner headline</label>
                <input type="text" id="heroHeadline" placeholder="Defaults to the title">
            </div>
            <div class="form-group">
                <label>Highlighted phrase</label>
                <input type="text" id="heroAccent" placeholder="e.g. & Discovery">
                <div class="hint">Optional accent shown in red on the homepage banner.</div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Adult price ($)</label>
                <input type="number" id="adultPrice" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label>Child price ($)</label>
                <input type="number" id="childPrice" step="0.01" min="0">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Total capacity</label>
                <input type="number" id="capacity" min="0">
            </div>
            <div class="form-group">
                <label>Spots remaining</label>
                <input type="number" id="spotsRemaining" min="0">
            </div>
        </div>

        <div class="form-group">
            <label>Image filename</label>
            <input type="text" id="image" placeholder="jamestown-illustration.jpg">
            <div class="hint">Must already exist in the site's files — this doesn't upload a new image.</div>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="hidden">
            <label for="hidden" style="font-weight: 600; font-size: 0.88rem;">Hide from the public site</label>
        </div>

        <div class="modal-actions">
            <span class="modal-cancel" style="color: var(--sub); cursor: pointer; font-weight: 600; font-size: 0.88rem;" onclick="closeForm()">Cancel</span>
            <button class="btn" onclick="saveTrip()">Save Trip</button>
        </div>
    </div>
</div>

<script>
let trips = [];

async function loadWhoAmI() {
    const el = document.getElementById('whoami');
    try {
        const res = await fetch('/.auth/me');
        const data = await res.json();
        const principal = data.clientPrincipal;
        if (principal) {
            el.innerHTML = `${principal.userDetails} &nbsp;·&nbsp; <a href="/.auth/logout">Log out</a>`;
        } else {
            el.innerHTML = `<a href="/.auth/login/aad">Log in</a>`;
        }
    } catch (e) {
        el.textContent = '';
    }
}

async function loadTrips() {
    const listEl = document.getElementById('tripList');
    listEl.className = 'loading-state';
    listEl.textContent = 'Loading trips…';
    try {
        const res = await fetch('/api/admin/trips');
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        trips = await res.json();
        renderTrips();
    } catch (e) {
        listEl.className = 'empty-state';
        listEl.textContent = 'Could not load trips. Are you logged in as an admin?';
    }
}

function renderTrips() {
    const listEl = document.getElementById('tripList');
    if (trips.length === 0) {
        listEl.className = 'empty-state';
        listEl.textContent = 'No trips yet — add one to get started.';
        return;
    }
    listEl.className = 'trip-list';
    listEl.innerHTML = trips.map(t => `
        <div class="trip-row ${t.hidden ? 'hidden-trip' : ''}">
            <div class="trip-info">
                <h3>${t.title}${t.hidden ? '<span class="hidden-badge">Hidden</span>' : ''}</h3>
                <div class="trip-meta">${t.location} · ${t.date} · ${t.spotsRemaining} of ${t.capacity} spots left</div>
            </div>
            <div class="trip-actions">
                <button class="btn-outline" onclick="editTrip('${t.id}')">Edit</button>
                <button class="btn-danger" onclick="removeTrip('${t.id}')">Delete</button>
            </div>
        </div>
    `).join('');
}

function openForm() {
    document.getElementById('formTitle').textContent = 'Add Trip';
    document.getElementById('tripId').value = '';
    ['title', 'location', 'date', 'description', 'heroHeadline', 'heroAccent', 'image'].forEach(id => document.getElementById(id).value = '');
    ['adultPrice', 'childPrice', 'capacity', 'spotsRemaining'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('hidden').checked = false;
    document.getElementById('status-message').style.display = 'none';
    document.getElementById('modal-overlay').style.display = 'flex';
}

function editTrip(id) {
    const t = trips.find(t => t.id === id);
    if (!t) return;
    document.getElementById('formTitle').textContent = 'Edit Trip';
    document.getElementById('tripId').value = t.id;
    document.getElementById('title').value = t.title;
    document.getElementById('location').value = t.location;
    document.getElementById('date').value = t.date;
    document.getElementById('description').value = t.description;
    document.getElementById('heroHeadline').value = t.heroHeadline === t.title ? '' : t.heroHeadline;
    document.getElementById('heroAccent').value = t.heroAccent;
    document.getElementById('adultPrice').value = t.adultPrice;
    document.getElementById('childPrice').value = t.childPrice;
    document.getElementById('capacity').value = t.capacity;
    document.getElementById('spotsRemaining').value = t.spotsRemaining;
    document.getElementById('image').value = t.image;
    document.getElementById('hidden').checked = t.hidden;
    document.getElementById('status-message').style.display = 'none';
    document.getElementById('modal-overlay').style.display = 'flex';
}

function closeForm() {
    document.getElementById('modal-overlay').style.display = 'none';
}

function showFormStatus(message, isError = true) {
    const el = document.getElementById('status-message');
    el.textContent = message;
    el.style.display = 'block';
    el.className = isError ? 'error' : 'success';
}

async function saveTrip() {
    const payload = {
        id: document.getElementById('tripId').value || undefined,
        title: document.getElementById('title').value.trim(),
        location: document.getElementById('location').value.trim(),
        date: document.getElementById('date').value,
        description: document.getElementById('description').value.trim(),
        heroHeadline: document.getElementById('heroHeadline').value.trim(),
        heroAccent: document.getElementById('heroAccent').value.trim(),
        adultPrice: parseFloat(document.getElementById('adultPrice').value) || 0,
        childPrice: parseFloat(document.getElementById('childPrice').value) || 0,
        capacity: parseInt(document.getElementById('capacity').value, 10) || 0,
        spotsRemaining: parseInt(document.getElementById('spotsRemaining').value, 10) || 0,
        image: document.getElementById('image').value.trim(),
        hidden: document.getElementById('hidden').checked
    };

    if (!payload.title || !payload.location || !payload.date || !payload.description) {
        showFormStatus('Title, location, date, and description are required.');
        return;
    }

    try {
        const res = await fetch('/api/admin/trips', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) {
            const text = await res.text();
            showFormStatus(`Error (HTTP ${res.status}): ${text || 'no details returned by the server'}`);
            return;
        }
        closeForm();
        loadTrips();
    } catch (e) {
        showFormStatus('Connection error. Please try again.');
    }
}

async function removeTrip(id) {
    const t = trips.find(t => t.id === id);
    if (!confirm(`Delete "${t ? t.title : id}"? This cannot be undone.`)) return;
    try {
        const res = await fetch(`/api/admin/trips/${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (!res.ok) {
            const text = await res.text();
            alert(`Could not delete trip (HTTP ${res.status}): ${text || 'no details returned by the server'}`);
            return;
        }
        loadTrips();
    } catch (e) {
        alert('Connection error. Please try again.');
    }
}

loadWhoAmI();
loadTrips();
</script>

</body>
</html>
