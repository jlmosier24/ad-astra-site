<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad Astra Active | Field Trips</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --cream: #F3EEE4;
        --paper: #FFFFFF;
        --ink: #221E19;
        --sub: #6E6659;
        --accent: #C1442E;
        --forest: #2F4A3B;
        --gold: #D99A3D;
        --line: rgba(34,30,25,0.12);
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #F8F3EA 0%, #F3EEE4 45%, #ECE3D3 100%) no-repeat; font-family: 'Public Sans', sans-serif; color: var(--ink); }

    nav {
        display: flex; align-items: center; justify-content: space-between;
        max-width: 1080px; margin: 0 auto; padding: 22px 24px;
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-mark { width: 22px; height: 22px; }
    .brand-name { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; }
    .nav-links { display: flex; gap: 28px; font-size: 0.88rem; font-weight: 600; }
    .nav-links a { color: var(--ink); text-decoration: none; }
    .nav-links a:hover { color: var(--accent); }
    .nav-toggle { display: none; background: none; border: none; padding: 4px; color: var(--ink); cursor: pointer; }
    .nav-toggle svg { width: 26px; height: 26px; }

    .hero { position: relative; max-width: 1080px; margin: 0 auto 20px; padding: 0 24px; }
    .hero-frame { position: relative; border-radius: 18px; overflow: hidden; height: 440px; background: #B7D8E0; }
    .hero-bg-layer { position: absolute; inset: 0; }
    .hero-slide-bg { position: absolute; inset: 0; opacity: 0; transition: opacity 0.7s ease; }
    .hero-slide-bg.active { opacity: 1; }
    .hero-slide-bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
    .hero-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.03) 40%, rgba(0,0,0,0.45) 100%); z-index: 1; }

    .hero-date-tag { position: absolute; top: 20px; right: 24px; z-index: 2; background: var(--accent); color: #fff; border-radius: 999px; padding: 5px 14px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; transition: opacity 0.3s ease; }
    .hero-headline {
        position: absolute; left: 24px; right: 24px; top: 44%; z-index: 2;
        transform: translateY(-50%);
        font-family: 'Anton', sans-serif; font-weight: 400;
        font-size: clamp(2.2rem, 6.5vw, 4.4rem);
        line-height: 0.95; color: #fff; text-transform: uppercase;
        transition: opacity 0.3s ease;
    }
    .hero-dots { position: absolute; left: 24px; bottom: 78px; z-index: 2; display: flex; gap: 8px; }
    .hero-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); border: none; cursor: pointer; padding: 0; }
    .hero-dot.active { background: #fff; }
    .hero-cta {
        position: absolute; right: 24px; bottom: 24px; z-index: 2; width: 84px; height: 84px; border-radius: 50%;
        background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.5); backdrop-filter: blur(3px);
        color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; cursor: pointer;
    }
    .hero-cta svg { width: 16px; height: 16px; }

    .trips { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
    .trips-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; flex-wrap: wrap; gap: 8px; }
    .trips-head h2 { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; font-size: clamp(1.6rem, 3.5vw, 2.2rem); margin: 0; letter-spacing: 0.01em; }
    .trips-head p { color: var(--sub); font-size: 0.9rem; margin: 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .card { background: var(--paper); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 22px rgba(34,30,25,0.06); }
    .art-frame { position: relative; height: 210px; overflow: hidden; background: #B7D8E0; }
    .art-frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
    .art-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(to top, rgba(0,0,0,0.28), rgba(0,0,0,0)); pointer-events: none; }
    .spots-tag { position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.94); border-radius: 999px; padding: 4px 11px; font-size: 0.68rem; font-weight: 700; color: var(--ink); }
    .date-tag { position: absolute; top: 14px; right: 14px; background: var(--accent); color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }

    .card-body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; font-size: 1.3rem; letter-spacing: 0.01em; margin: 0 0 4px; }
    .card-location { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .location-text { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--forest); font-weight: 700; min-width: 0; }
    .location-text span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .location-text svg { width: 14px; height: 14px; flex-shrink: 0; }
    .directions-link {
        display: flex; align-items: center; gap: 5px; flex-shrink: 0;
        background: var(--cream); color: var(--ink); text-decoration: none;
        border-radius: 999px; padding: 5px 11px 5px 8px; font-size: 0.72rem; font-weight: 700;
        border: 1px solid var(--line);
        transition: background 0.15s ease, color 0.15s ease;
    }
    .directions-link svg { width: 15px; height: 15px; flex-shrink: 0; }
    .directions-link:hover { background: var(--forest); color: #fff; }
    .card-desc { font-size: 0.89rem; line-height: 1.5; color: var(--sub); margin-bottom: 18px; flex-grow: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; gap: 10px; }
    .price { font-weight: 800; font-size: 0.98rem; }
    .price span { display: block; font-family: 'Public Sans', sans-serif; font-size: 0.68rem; font-weight: 500; color: var(--sub); }
    .btn { background: var(--ink); color: #fff; border: none; padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 0.84rem; cursor: pointer; white-space: nowrap; }
    .btn:hover { background: var(--accent); }

    /* Loading skeletons, shown in the trips grid until /api/trips resolves
       -- so a cold start or slow connection reads as "loading" rather than
       a blank, possibly-broken page. */
    .skeleton-card { background: var(--paper); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 22px rgba(34,30,25,0.06); }
    .skeleton-img { height: 210px; }
    .skeleton-body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex-grow: 1; }
    .skeleton-line { border-radius: 4px; }
    .skeleton-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; margin-top: auto; }
    .shimmer {
        background: linear-gradient(90deg, var(--line) 0%, var(--line) 40%, rgba(255,255,255,0.8) 50%, var(--line) 60%, var(--line) 100%);
        background-size: 200% 100%;
        animation: shimmer 1.6s linear infinite;
    }
    @keyframes shimmer {
        from { background-position: 200% 0; }
        to { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
        .shimmer { animation: none; background: var(--line); }
    }

    footer { text-align: center; padding: 30px 24px 50px; font-size: 0.8rem; color: var(--sub); border-top: 1px solid var(--line); }

    /* Registration modal (functionality carried over from the previous site) */
    #modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(34,30,25,0.55); backdrop-filter: blur(4px);
        z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        opacity: 0; transition: opacity 0.2s ease;
    }
    #modal-overlay.visible { opacity: 1; }
    .modal {
        background: var(--paper); border-radius: 20px;
        width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
        transform: scale(0.96) translateY(8px); transition: transform 0.2s ease;
    }
    #modal-overlay.visible .modal { transform: scale(1) translateY(0); }
    .modal-photo { position: relative; height: 160px; overflow: hidden; border-radius: 20px 20px 0 0; background: #B7D8E0; }
    .modal-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
    .modal-body { padding: 32px; }
    .modal h2 { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; color: var(--forest); margin: 0 0 4px; letter-spacing: 0.01em; }
    .modal-date { color: var(--sub); font-size: 0.88rem; margin-bottom: 20px; }
    #status-message { display: none; padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 0.88rem; font-weight: 600; }
    #status-message.error { background: #FBE4DF; color: var(--accent); }
    #status-message.success { background: #E4EBE6; color: var(--forest); }
    #reg-form { display: none; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
    .price-total-display { min-width: 60px; text-align: right; font-weight: 700; }
    .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .stepper-btn { background: var(--cream); border: none; width: 30px; height: 30px; font-size: 1.1rem; font-weight: 700; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; }
    .stepper-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
    .stepper-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .stepper-value { min-width: 28px; text-align: center; font-weight: 700; font-size: 0.95rem; }
    .capacity-note { font-size: 0.78rem; color: var(--sub); margin: -6px 0 14px; }
    .existing-reg-notice { background: #E4EBE6; color: var(--forest); font-size: 0.85rem; line-height: 1.5; padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; }
    .cancel-reg-link { text-align: center; color: var(--accent); cursor: pointer; margin-top: 10px; font-weight: 600; font-size: 0.85rem; }
    .grand-total-row { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 800; border-top: 2px dashed var(--line); padding-top: 14px; margin: 6px 0 20px; color: var(--forest); }
    .btn-submit { background: var(--accent); color: #fff; border: none; padding: 13px; border-radius: 999px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; }
    .btn-submit:hover { background: var(--ink); }
    .modal-cancel { text-align: center; color: var(--sub); cursor: pointer; margin-top: 14px; font-weight: 600; font-size: 0.88rem; }

    .success-check-circle { stroke: var(--forest); stroke-width: 3; fill: none; stroke-dasharray: 151; stroke-dashoffset: 151; animation: successCircle 0.5s ease forwards; }
    .success-check-mark { stroke: var(--forest); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: successMark 0.35s ease 0.45s forwards; }
    @keyframes successCircle { to { stroke-dashoffset: 0; } }
    @keyframes successMark { to { stroke-dashoffset: 0; } }
    .success-heading { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; color: var(--forest); font-size: 1.5rem; margin: 16px 0 6px; opacity: 0; animation: successFadeUp 0.4s ease 0.7s forwards; }
    .success-sub { color: var(--sub); font-size: 0.9rem; margin: 0; opacity: 0; animation: successFadeUp 0.4s ease 0.85s forwards; }
    @keyframes successFadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 560px) {
        nav { flex-wrap: wrap; }
        .nav-toggle { display: block; }
        .nav-links {
            display: none; width: 100%; flex-direction: column; gap: 16px;
            order: 3; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line);
        }
        .nav-links.open { display: flex; }
        .hero { display: none; }
        .grid { grid-template-columns: 1fr; }
        .card-footer { flex-direction: column; align-items: stretch; gap: 12px; }
        .btn { width: 100%; padding: 12px; }
    }
</style>
</head>
<body>

<nav>
    <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 8 L27.2 19.6 L39 22 L27.2 24.4 L24 36 L20.8 24.4 L9 22 L20.8 19.6 Z" fill="#C1442E"/>
        </svg>
        <span class="brand-name">Ad Astra Active</span>
    </div>
    <button class="nav-toggle" id="navToggle" onclick="toggleNavMenu()" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-links" id="navLinks">
        <a href="#trips">Trips</a>
        <a href="about.html">About</a>
        <a href="#">Contact</a>
    </div>
</nav>

<div class="hero">
    <div class="hero-frame">
        <div class="hero-bg-layer" id="heroBgLayer"></div>
        <div class="hero-scrim"></div>
        <div class="hero-date-tag" id="heroDateTag"></div>
        <div class="hero-headline" id="heroHeadline"></div>
        <div class="hero-dots" id="heroDots"></div>
        <div class="hero-cta" id="heroCta">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Register
        </div>
    </div>
</div>

<div class="trips" id="trips">
    <div class="trips-head">
        <h2>Upcoming Trips</h2>
    </div>
    <div class="grid" id="tripsGrid">
        <div class="skeleton-card">
            <div class="skeleton-img shimmer"></div>
            <div class="skeleton-body">
                <div class="skeleton-line shimmer" style="width: 60%; height: 22px; margin-bottom: 12px;"></div>
                <div class="skeleton-line shimmer" style="width: 85%; height: 14px; margin-bottom: 16px;"></div>
                <div class="skeleton-line shimmer" style="width: 100%; height: 12px; margin-bottom: 8px;"></div>
                <div class="skeleton-line shimmer" style="width: 90%; height: 12px; margin-bottom: 8px;"></div>
                <div class="skeleton-line shimmer" style="width: 55%; height: 12px; margin-bottom: 18px;"></div>
                <div class="skeleton-footer">
                    <div class="skeleton-line shimmer" style="width: 70px; height: 20px;"></div>
                    <div class="skeleton-line shimmer" style="width: 100px; height: 38px; border-radius: 999px;"></div>
                </div>
            </div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-img shimmer"></div>
            <div class="skeleton-body">
                <div class="skeleton-line shimmer" style="width: 70%; height: 22px; margin-bottom: 12px;"></div>
                <div class="skeleton-line shimmer" style="width: 80%; height: 14px; margin-bottom: 16px;"></div>
                <div class="skeleton-line shimmer" style="width: 100%; height: 12px; margin-bottom: 8px;"></div>
                <div class="skeleton-line shimmer" style="width: 95%; height: 12px; margin-bottom: 8px;"></div>
                <div class="skeleton-line shimmer" style="width: 65%; height: 12px; margin-bottom: 18px;"></div>
                <div class="skeleton-footer">
                    <div class="skeleton-line shimmer" style="width: 70px; height: 20px;"></div>
                    <div class="skeleton-line shimmer" style="width: 100px; height: 38px; border-radius: 999px;"></div>
                </div>
            </div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-img shimmer"></div>
            <div class="skeleton-body">

                <div class="skeleton-line shimmer" style="width: 90%; height: 14px; margin-bottom: 16px;"></div>

                <div class="skeleton-line shimmer" style="width: 85%; height: 12px; margin-bottom: 8px;"></div>
                <div class="skeleton-line shimmer" style="width: 60%; height: 12px; margin-bottom: 18px;"></div>
                <div class="skeleton-footer">

        <div id="success-state" style="display: none; text-align: center; padding: 10px 0 6px;">

                <path class="success-check-mark" fill="none" d="M14 27l7 7 16-16"/>
            </svg>

        <div id="email-section">

                <label>Parent Name</label>

            </div>

                        <span class="stepper-value" id="childCountDisplay">0</span>
                        <button type="button" class="stepper-btn" id="childPlus" onclick="adjustCount('childCount', 1)" aria-label="Increase children">+</button>

<script>
// Trip data now comes from /api/trips (backed by Azure Table Storage,
// managed via /admin.html) instead of being hardcoded here.
let trips = [];

function formatDateLabel(isoDate) {
    const [y, m, d] = isoDate.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toUpperCase();
}

function formatTimeLabel(time) {
    if (!time) return '';
    const [h, m] = time.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const hour12 = h % 12 || 12;
    return `${hour12}:${String(m).padStart(2, '0')} ${period}`;
}

function formatFullDate(isoDate, time) {
    const [y, m, d] = isoDate.split('-').map(Number);
    const dateLabel = new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    const timeLabel = formatTimeLabel(time);
    return timeLabel ? `${dateLabel} at ${timeLabel}` : dateLabel;
}

function formatCardPrice(t) {
    if (t.adultPrice === 0 && t.childPrice === 0) return 'Free';
    const adultText = t.adultPrice === 0 ? 'Free' : `$${t.adultPrice.toFixed(2)}`;
    const childText = t.childPrice === 0 ? 'Free' : `$${t.childPrice.toFixed(2)}`;
    return `${adultText} <span>ages 12+ · ${childText} ages 2–11</span>`;
}

function toggleNavMenu() {
    const links = document.getElementById('navLinks');
    const isOpen = links.classList.toggle('open');
    document.getElementById('navToggle').setAttribute('aria-expanded', String(isOpen));
}

document.querySelectorAll('.nav-links a').forEach(a => {
    a.addEventListener('click', () => {
        document.getElementById('navLinks').classList.remove('open');
        document.getElementById('navToggle').setAttribute('aria-expanded', 'false');
    });
});

let heroIndex = 0;
let heroTimer = null;
// Fades an overlay in/out rather than snapping display on/off. display
// still gates layout/interactivity; the class just drives the transition.
function openOverlay(id) {
    const el = document.getElementById(id);
    el.style.display = 'flex';
    void el.offsetHeight; // force a reflow so the display change is applied before .visible triggers the transition
    el.classList.add('visible');
}
function closeOverlay(id) {
    const el = document.getElementById(id);
    el.classList.remove('visible');
    setTimeout(() => { el.style.display = 'none'; }, 200);
}

let selectedTrip = null;
let existingRegistration = null;

function renderHeroLayer() {
    const layer = document.getElementById('heroBgLayer');
    layer.innerHTML = trips.map(t => `
        <div class="hero-slide-bg" data-scene="${t.id}">
            <img src="${t.image}" alt="${t.title}">
        </div>
    `).join('');
}

function applyHeroSlide(idx) {
    const t = trips[idx];
    document.querySelectorAll('.hero-slide-bg').forEach(el => {
        el.classList.toggle('active', el.dataset.scene === t.id);
    });
    document.getElementById('heroHeadline').textContent = t.title;
    document.getElementById('heroDateTag').textContent = formatDateLabel(t.date);
    document.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
}

function fadeToHeroSlide(idx) {
    const headline = document.getElementById('heroHeadline');
    const dateTag = document.getElementById('heroDateTag');
    headline.style.opacity = 0;
    dateTag.style.opacity = 0;
    setTimeout(() => {
        applyHeroSlide(idx);
        headline.style.opacity = 1;
        dateTag.style.opacity = 1;
    }, 300);
}

function goToHeroSlide(idx) {
    heroIndex = idx;
    fadeToHeroSlide(heroIndex);
    resetHeroTimer();
}

function nextHeroSlide() {
    heroIndex = (heroIndex + 1) % trips.length;
    fadeToHeroSlide(heroIndex);
}

function resetHeroTimer() {
    if (heroTimer) clearInterval(heroTimer);
    heroTimer = setInterval(nextHeroSlide, 5000);
}

function directionsUrl(t) {
    const query = t.placeName ? `${t.placeName}, ${t.address}` : t.address;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

// Full street addresses were getting cut off on the card. City/state is
// enough to place the trip at a glance -- the full address is still used
// for Directions and everywhere else.
function cityStateLabel(address) {
    const parts = address.split(',').map(s => s.trim()).filter(Boolean);
    if (parts.length < 2) return address;
    const city = parts[parts.length - 2];
    const state = parts[parts.length - 1].split(' ')[0];
    return `${city}, ${state}`;
}

function renderTripCards() {
    const grid = document.getElementById('tripsGrid');
    grid.innerHTML = trips.map(t => `
        <div class="card">
            <div class="art-frame">
                <img src="${t.image}" alt="${t.title}">
                <div class="art-fade"></div>
                ${t.capacity > 0 ? `<div class="spots-tag">Limited capacity</div>` : ''}
                <div class="date-tag">${formatDateLabel(t.date)}</div>
            </div>
            <div class="card-body">
                <div class="card-title">${t.title}</div>
                <div class="card-location">
                    <div class="location-text">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                        <span>${cityStateLabel(t.address)}</span>
                    </div>
                    <a class="directions-link" href="${directionsUrl(t)}" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                        Directions
                    </a>
                </div>
                <div class="card-desc">${t.description}</div>
                <div class="card-footer">
                    <div class="price">${formatCardPrice(t)}</div>
                    <button class="btn" onclick="openModal('${t.id}')">Register</button>
                </div>
            </div>
        </div>
    `).join('');
}

function openModal(tripId) {
    selectedTrip = trips.find(t => t.id === tripId);
    if (!selectedTrip) return;
    existingRegistration = null;

    const modalImage = document.getElementById('modalImage');
    modalImage.src = selectedTrip.image;
    modalImage.alt = selectedTrip.title;
    document.getElementById('modal-title').textContent = selectedTrip.title;
    document.getElementById('modal-details').textContent = formatFullDate(selectedTrip.date, selectedTrip.time);
    document.getElementById('adultLabel').textContent = `Adult ($${selectedTrip.adultPrice.toFixed(2)})`;
    document.getElementById('childLabel').textContent = `Child (2-11) ($${selectedTrip.childPrice.toFixed(2)})`;

    openOverlay('modal-overlay');
    populateRegForm();
}

function updateTotals() {
    if (!selectedTrip) return;
    const adults = parseInt(document.getElementById('adultCount').value);
    const children = parseInt(document.getElementById('childCount').value);

    const adultTotal = adults * selectedTrip.adultPrice;
    const childTotal = children * selectedTrip.childPrice;
    const grandTotal = adultTotal + childTotal;

    document.getElementById('adultSubtotal').textContent = `$${adultTotal.toFixed(2)}`;
    document.getElementById('childSubtotal').textContent = `$${childTotal.toFixed(2)}`;
    document.getElementById('grandTotal').textContent = `$${grandTotal.toFixed(2)}`;
}

// Trips with a capacity behave as one shared pool of spots for adults and
// children combined. Trips with no maximum (capacity 0) still get a sane
// ceiling so the stepper can't be tapped into an absurd number. When
// editing an existing registration, its own current attendees are added
// back in -- they aren't competing against themselves for the remaining
// spots.
function getAttendeeCap(trip) {
    const base = trip.capacity > 0 ? trip.spotsRemaining : 20;
    const ownExisting = existingRegistration ? (existingRegistration.adults + existingRegistration.children) : 0;
    return base + ownExisting;
}

// Resets (or fills, if editing) the registration form based on whether
// existingRegistration is set. Called after a successful email verify, and
// when the modal first opens (with existingRegistration still null).
function populateRegForm() {
    const notice = document.getElementById('existingRegNotice');
    const submitBtn = document.getElementById('submitBtn');
    const cancelLink = document.getElementById('cancelRegLink');

    if (existingRegistration) {
        notice.style.display = 'block';
        submitBtn.textContent = 'Save Changes';
        cancelLink.style.display = 'block';
        document.getElementById('parentName').value = existingRegistration.parentName;
        document.getElementById('adultCount').value = existingRegistration.adults;
        document.getElementById('childCount').value = existingRegistration.children;
        document.getElementById('adultCountDisplay').textContent = existingRegistration.adults;
        document.getElementById('childCountDisplay').textContent = existingRegistration.children;
    } else {
        notice.style.display = 'none';
        submitBtn.textContent = 'Complete Registration';
        cancelLink.style.display = 'none';
        document.getElementById('parentName').value = '';
        document.getElementById('adultCount').value = '0';
        document.getElementById('childCount').value = '0';
        document.getElementById('adultCountDisplay').textContent = '0';
        document.getElementById('childCountDisplay').textContent = '0';
    }

    updateTotals();
    refreshStepperState();
}

function adjustCount(fieldId, delta) {
    if (!selectedTrip) return;
    const input = document.getElementById(fieldId);
    const otherId = fieldId === 'adultCount' ? 'childCount' : 'adultCount';
    const current = parseInt(input.value, 10) || 0;
    const other = parseInt(document.getElementById(otherId).value, 10) || 0;
    const cap = getAttendeeCap(selectedTrip);

    const next = Math.max(0, Math.min(current + delta, cap - other));
    input.value = next;
    document.getElementById(fieldId === 'adultCount' ? 'adultCountDisplay' : 'childCountDisplay').textContent = next;

    updateTotals();
    refreshStepperState();
}

function refreshStepperState() {
    if (!selectedTrip) return;
    const adults = parseInt(document.getElementById('adultCount').value, 10) || 0;
    const children = parseInt(document.getElementById('childCount').value, 10) || 0;
    const cap = getAttendeeCap(selectedTrip);
    const total = adults + children;
    const atCap = total >= cap;

    document.getElementById('adultMinus').disabled = adults <= 0;
    document.getElementById('childMinus').disabled = children <= 0;
    document.getElementById('adultPlus').disabled = atCap;
    document.getElementById('childPlus').disabled = atCap;

    const noteEl = document.getElementById('capacityNote');
    if (selectedTrip.capacity > 0) {
        noteEl.style.display = 'block';
        noteEl.textContent = atCap
            ? `That's all ${cap} spot${cap === 1 ? '' : 's'} available for this trip.`
            : `${cap - total} of ${cap} spot${cap === 1 ? '' : 's'} left for this trip.`;
    } else {
        noteEl.style.display = 'none';
    }
}

function showStatus(message, isError = true) {
    const statusDiv = document.getElementById('status-message');
    statusDiv.textContent = message;
    statusDiv.style.display = 'block';
    statusDiv.className = isError ? 'error' : 'success';
}

// Swaps the form out for an animated checkmark moment instead of a plain
// success banner -- this is the one interaction every registering parent
// sees, so it earns a little more polish than a static line of text.
function showSuccessState(subMessage) {
    document.getElementById('status-message').style.display = 'none';
    document.getElementById('email-section').style.display = 'none';
    document.getElementById('reg-form').style.display = 'none';
    document.querySelector('.modal-cancel').style.display = 'none';

    const state = document.getElementById('success-state');
    document.getElementById('successSub').textContent = subMessage;
    state.style.display = 'block';

    // Restart the draw-in animations in case this modal was shown before.
    const circle = state.querySelector('.success-check-circle');
    const mark = state.querySelector('.success-check-mark');
    const heading = state.querySelector('.success-heading');
    const sub = state.querySelector('.success-sub');
    [circle, mark, heading, sub].forEach(el => { el.style.animation = 'none'; });
    void state.offsetWidth;
    [circle, mark, heading, sub].forEach(el => { el.style.animation = ''; });
}

function closeModal() {
    closeOverlay('modal-overlay');
    document.getElementById('email-section').style.display = 'block';
    document.getElementById('reg-form').style.display = 'none';
    document.getElementById('status-message').style.display = 'none';
    document.getElementById('success-state').style.display = 'none';
    document.querySelector('.modal-cancel').style.display = '';
    document.getElementById('emailInput').value = '';
    document.getElementById('parentName').value = '';
    selectedTrip = null;
    existingRegistration = null;
}

async function verifyEmail() {
    const email = document.getElementById('emailInput').value.toLowerCase().trim();
    if (!email) { showStatus("Please enter an email address."); return; }
    if (!selectedTrip) return;

    try {
        const response = await fetch(`/api/verifyEmail?email=${encodeURIComponent(email)}&tripId=${encodeURIComponent(selectedTrip.id)}`);
        const data = await response.json();
        if (!data.isApproved) {
            showStatus("This email is not on the authorized list.");
            return;
        }
        existingRegistration = data.existingRegistration || null;
        document.getElementById('status-message').style.display = 'none';
        document.getElementById('email-section').style.display = 'none';
        document.getElementById('reg-form').style.display = 'block';
        populateRegForm();
    } catch (error) {
        showStatus("Connection error. Please try again.");
    }
}

async function submitRegistration() {
    if (!selectedTrip) return;
    if (existingRegistration) return updateExistingRegistration();

    const parentName = document.getElementById('parentName').value;
    const adults = document.getElementById('adultCount').value;
    const children = document.getElementById('childCount').value;
    const total = document.getElementById('grandTotal').textContent;
    const email = document.getElementById('emailInput').value;

    if (!parentName || (adults == 0 && children == 0)) {
        showStatus("Please enter your name and select at least one attendee.");
        return;
    }

    showStatus("Sending your confirmation...", false);

    try {
        const response = await fetch('/api/sendConfirmation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                parentName: parentName,
                adults: adults,
                children: children,
                total: total,
                email: email,
                tripId: selectedTrip.id,
                tripTitle: selectedTrip.title
            })
        });

        if (response.ok) {
            showSuccessState(`You're registered for ${selectedTrip.title}. Check your inbox for a confirmation email.`);
            setTimeout(closeModal, 2600);
        } else {
            const errorText = await response.text();
            showStatus("Error: " + errorText);
        }
    } catch (error) {
        showStatus("Connection error. Please try again.");
    }
}

async function updateExistingRegistration() {
    if (!selectedTrip || !existingRegistration) return;
    const parentName = document.getElementById('parentName').value;
    const adults = document.getElementById('adultCount').value;
    const children = document.getElementById('childCount').value;
    const email = document.getElementById('emailInput').value;

    if (!parentName || (adults == 0 && children == 0)) {
        showStatus("Please enter your name and select at least one attendee, or use Cancel My Registration below.");
        return;
    }

    showStatus("Saving your changes...", false);

    try {
        const response = await fetch('/api/updateRegistration', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tripId: selectedTrip.id,
                registrationId: existingRegistration.id,
                parentName,
                adults,
                children,
                email
            })
        });
        const message = await response.text();
        if (response.ok) {
            showStatus(message || 'Your registration has been updated.', false);
            setTimeout(closeModal, 2500);
        } else {
            showStatus("Error: " + message);
        }
    } catch (error) {
        showStatus("Connection error. Please try again.");
    }
}

async function cancelRegistration() {
    if (!selectedTrip || !existingRegistration) return;
    if (!confirm(`Cancel your registration for ${selectedTrip.title}? This can't be undone.`)) return;

    const email = document.getElementById('emailInput').value;
    showStatus("Cancelling your registration...", false);

    try {
        const response = await fetch('/api/cancelRegistration', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tripId: selectedTrip.id,
                registrationId: existingRegistration.id,
                email
            })
        });
        const message = await response.text();
        if (response.ok) {
            showStatus(message || 'Your registration has been cancelled.', false);
            existingRegistration = null;
            setTimeout(closeModal, 2000);
        } else {
            showStatus("Error: " + message);
        }
    } catch (error) {
        showStatus("Connection error. Please try again.");
    }
}

async function init() {
    try {
        const res = await fetch('/api/trips');
        trips = await res.json();
    } catch (e) {
        trips = [];
    }

    renderTripCards();
    const heroEl = document.querySelector('.hero');
    if (trips.length === 0) {
        heroEl.style.display = 'none';
        return;
    }
    heroEl.style.display = '';

    renderHeroLayer();
    const dotsEl = document.getElementById('heroDots');
    trips.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'hero-dot';
        dot.setAttribute('aria-label', `Show trip ${i + 1}`);
        dot.addEventListener('click', () => goToHeroSlide(i));
        dotsEl.appendChild(dot);
    });
    document.getElementById('heroCta').addEventListener('click', () => openModal(trips[heroIndex].id));
    applyHeroSlide(0);
    if (trips.length > 1) resetHeroTimer();
}

init();
</script>
