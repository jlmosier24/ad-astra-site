<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Astra Field Trips | Exploration & Discovery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --forest-green: #38a169;
            --meadow-green: #c6f6d5;
            --sky-blue: #7bb9e8;
            --earth-brown: #8b5a2b;
            --sun-yellow: #f6e05e;
            --text-dark: #2d3748;
            --bg-page: #f0fff4;
            --accent-teal: #00b5ad;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-page);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            width: 100%;
            background: var(--sky-blue) linear-gradient(180deg, var(--sky-blue) 0%, #ffffff 100%);
            display: flex; flex-direction: column; align-items: center;
            border-bottom: 6px solid var(--earth-brown);
        }

        .header-banner {
            width: 100%; max-width: 1100px;
            height: auto;
            margin-top: 20px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }

        .title-section {
            background: white; width: 100%; text-align: center; padding: 20px 0;
        }

        h1 {
            font-family: 'Luckiest Guy', cursive;
            color: var(--earth-brown);
            font-size: 3.5rem; margin: 0;
            text-shadow: 2px 2px 0px var(--sun-yellow);
        }

        .subtitle {
            color: var(--forest-green);
            font-weight: 700; font-size: 1.1rem;
            margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 1px;
        }

        .main-container {
            width: 95%; max-width: 1100px;
            margin: 40px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .event-card {
            background: white;
            width: 320px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }

        .date-ribbon {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--accent-teal);
            color: black;
            font-weight: 800;
            padding: 8px 15px;
            border-bottom-left-radius: 10px;
            font-size: 0.9rem;
            z-index: 10;
        }

        .card-image {
            width: 100%;
            height: 380px; 
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 1.6rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .card-description {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.4;
            margin-bottom: 20px;
            flex-grow: 1;
            white-space: pre-line;
        }

        .btn-card-register {
            background: var(--forest-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-card-register:hover {
            background: var(--earth-brown);
        }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: center;
        }

        .modal {
            background: white; border: 5px solid var(--forest-green);
            border-radius: 30px; padding: 30px; width: 95%; max-width: 500px;
            text-align: center; max-height: 90vh; overflow-y: auto;
        }

        #status-message {
            display: none;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        #reg-form { display: none; text-align: left; margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 700; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 2px solid var(--sky-blue); border-radius: 8px; box-sizing: border-box;}
        
        .btn-submit { background: var(--earth-brown); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.2rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }

        .price-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            padding: 10px; 
            border: 1px solid var(--meadow-green); 
            border-radius: 12px;
        }
        .price-total-display {
            min-width: 60px; 
            text-align: right; 
            font-weight: 600;
        }
    </style>
</head>
<body>

<header>
    <img src="header.png" class="header-banner" alt="Ad Astra Field Trips">
    <div class="title-section">
        <h1>AD ASTRA ACTIVE</h1>
        <p class="subtitle">Nature & Science Outings • Academic Discovery</p>
    </div>
</header>

<div class="main-container" id="events-grid"></div>

<div id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title" style="font-family: 'Luckiest Guy'; color: var(--forest-green);"></h2>
        <p id="modal-details" style="margin-bottom: 20px; color: #555;"></p>

        <div id="status-message"></div>

        <div id="email-section">
            <input type="email" id="emailInput" placeholder="Enter approved email">
            <button class="btn-submit" onclick="verifyEmail()" style="margin-top: 10px;">Verify Email</button>
        </div>

        <div id="reg-form">
            <div class="form-group">
                <label>Parent Name</label>
                <input type="text" id="parentName">
            </div>

            <div class="price-row">
                <div id="adultLabel" style="font-weight: 700;">Adult</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <select id="adultCount" onchange="updateTotals()" style="width: 65px;">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                    <span id="adultSubtotal" class="price-total-display">$0.00</span>
                </div>
            </div>

            <div class="price-row">
                <div id="childLabel" style="font-weight: 700;">Child</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <select id="childCount" onchange="updateTotals()" style="width: 65px;">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                    <span id="childSubtotal" class="price-total-display">$0.00</span>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800; border-top: 2px dashed var(--sky-blue); padding-top: 15px; margin-bottom: 20px; color: var(--earth-brown);">
                <span>TOTAL DUE:</span>
                <span id="grandTotal">$0.00</span>
            </div>

            <button class="btn-submit" onclick="submitRegistration()">Complete Registration</button>
        </div>

        <p onclick="closeModal()" style="color: #999; cursor: pointer; margin-top: 15px; font-weight: 600;">Cancel</p>
    </div>
</div>

<script>
    let selectedEventTitle = "";
    let currentAdultPrice = 0;
    let currentChildPrice = 0;

    const events = [
        {
            title: 'Historic Jamestown',
            dateLabel: 'SEPT 2',
            fullDate: 'Wednesday, September 2, 2026',
            price: 'From $10.00',
            img: 'jamestown2.png',
            desc: "Experience the dawn of American history by exploring life-sized colonial ships and immersive living history exhibits along the scenic James River.",
            adultPrice: 15.00,
            childPrice: 10.00
        },
        {
            title: 'Telescope Night',
            dateLabel: 'MAR 18',
            fullDate: 'Wednesday, March 18, 2026',
            price: 'From $5.00',
            img: 'telescope.png',
            desc: "Join us under the stars! Use high-powered telescopes to view the craters of the moon and distant planets.",
            adultPrice: 10.00,
            childPrice: 5.00
        }
    ];

    function renderEvents() {
        const grid = document.getElementById('events-grid');
        grid.innerHTML = events.map(event => `
            <div class="event-card">
                <div class="date-ribbon">${event.dateLabel}</div>
                <img src="${event.img}" class="card-image" alt="${event.title}">
                <div class="card-content">
                    <div class="card-title">${event.title}</div>
                    <div class="card-description">${event.desc}</div>
                    <button class="btn-card-register" onclick="openModal('${event.title}', '${event.fullDate}', ${event.adultPrice}, ${event.childPrice})">
                        Register • ${event.price}
                    </button>
                </div>
            </div>
        `).join('');
    }

    function updateTotals() {
        const adults = parseInt(document.getElementById('adultCount').value);
        const children = parseInt(document.getElementById('childCount').value);

        const adultTotal = adults * currentAdultPrice;
        const childTotal = children * currentChildPrice;
        const grandTotal = adultTotal + childTotal;

        document.getElementById('adultSubtotal').innerText = `$${adultTotal.toFixed(2)}`;
        document.getElementById('childSubtotal').innerText = `$${childTotal.toFixed(2)}`;
        document.getElementById('grandTotal').innerText = `$${grandTotal.toFixed(2)}`;
    }

    function openModal(title, date, aPrice, cPrice) {
        selectedEventTitle = title;
        currentAdultPrice = aPrice;
        currentChildPrice = cPrice;

        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-details').innerText = date;
        
        // Update labels to show specific prices for this trip
        document.getElementById('adultLabel').innerText = `Adult ($${aPrice.toFixed(2)})`;
        document.getElementById('childLabel').innerText = `Child (2-11) ($${cPrice.toFixed(2)})`;

        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('adultCount').value = "0";
        document.getElementById('childCount').value = "0";
        updateTotals();
    }

    function showStatus(message, isError = true) {
        const statusDiv = document.getElementById('status-message');
        statusDiv.innerText = message;
        statusDiv.style.display = 'block';
        statusDiv.style.backgroundColor = isError ? '#fed7d7' : '#c6f6d5';
        statusDiv.style.color = isError ? '#c53030' : '#22543d';
        statusDiv.style.border = isError ? '1px solid #feb2b2' : '1px solid #9ae6b4';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('email-section').style.display = 'block';
        document.getElementById('reg-form').style.display = 'none';
        document.getElementById('status-message').style.display = 'none';
        document.getElementById('emailInput').value = '';
        document.getElementById('parentName').value = '';
    }

    async function verifyEmail() {
        const email = document.getElementById('emailInput').value.toLowerCase().trim();
        if (!email) { showStatus("Please enter an email address."); return; }

        try {
            const response = await fetch(`/api/verifyEmail?email=${encodeURIComponent(email)}`);
            const data = await response.json();
            if (data.isApproved) {
                document.getElementById('status-message').style.display = 'none';
                document.getElementById('email-section').style.display = 'none';
                document.getElementById('reg-form').style.display = 'block';
            } else {
                showStatus("This email is not on the authorized list.");
            }
        } catch (error) {
            showStatus("Connection error. Please try again.");
        }
    }

    async function submitRegistration() {
        const parentName = document.getElementById('parentName').value;
        const adults = document.getElementById('adultCount').value;
        const children = document.getElementById('childCount').value;
        const total = document.getElementById('grandTotal').innerText;
        const email = document.getElementById('emailInput').value;

        if (!parentName || (adults == 0 && children == 0)) {
            showStatus("Please enter your name and select at least one attendee.");
            return;
        }

        showStatus("Sending your confirmation...", false);

        try {
            const response = await fetch('/api/sendConfirmation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    parentName: parentName,
                    adults: adults,
                    children: children,
                    total: total,
                    email: email,
                    tripTitle: selectedEventTitle
                })
            });

            if (response.ok) {
                showStatus(`Success! Registration for ${selectedEventTitle} has been sent.`, false);
                setTimeout(closeModal, 3000);
            } else {
                const errorText = await response.text();
                showStatus("Error: " + errorText);
            }
        } catch (error) {
            showStatus("Connection error. Please try again.");
        }
    }

    renderEvents();
</script>

</body>
</html>
