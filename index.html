<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Astra Field Trips | Exploration & Discovery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --forest-green: #38a169;
            --meadow-green: #c6f6d5;
            --sky-blue: #7bb9e8;
            --earth-brown: #8b5a2b;
            --sun-yellow: #f6e05e;
            --text-dark: #2d3748;
            --bg-page: #f0fff4;
            --accent-teal: #00b5ad;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-page);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            width: 100%;
            background: var(--sky-blue) linear-gradient(180deg, var(--sky-blue) 0%, #ffffff 100%);
            display: flex; flex-direction: column; align-items: center;
            border-bottom: 6px solid var(--earth-brown);
        }

        .header-banner {
            width: 100%; max-width: 1100px;
            height: auto;
            margin-top: 20px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }

        .title-section {
            background: white; width: 100%; text-align: center; padding: 20px 0;
        }

        h1 {
            font-family: 'Luckiest Guy', cursive;
            color: var(--earth-brown);
            font-size: 3.5rem; margin: 0;
            text-shadow: 2px 2px 0px var(--sun-yellow);
        }

        .subtitle {
            color: var(--forest-green);
            font-weight: 700; font-size: 1.1rem;
            margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 1px;
        }

        .main-container {
            width: 95%; max-width: 1100px;
            margin: 40px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .event-card {
            background: white;
            width: 320px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }

        .date-ribbon {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--accent-teal);
            color: black;
            font-weight: 800;
            padding: 8px 15px;
            border-bottom-left-radius: 10px;
            font-size: 0.9rem;
            z-index: 10;
        }

        .card-image {
            width: 100%;
            height: 380px; 
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-family: 'Luckiest Guy', cursive;
            font-size: 1.6rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .card-description {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.4;
            margin-bottom: 20px;
            flex-grow: 1;
            white-space: pre-line; /* Allows \n to render as new lines */
        }

        .btn-card-register {
            background: var(--forest-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-card-register:hover {
            background: var(--earth-brown);
        }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: center;
        }
